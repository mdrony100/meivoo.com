<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password || LegacyTree</title>
  <meta name="description" content="Reset your Family Legacy password and regain access to your private family portal.">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="./assets/images/fab-icon.ico">
  
  <!-- Bootstrap v5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome v6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  
  <!-- AOS (Animate On Scroll) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">

  <!-- Custom Styles -->
  <link href="./assets/style.css" rel="stylesheet">
</head>

<body>
  <div class="forgot-page">
      <main class="forgot-shell">
        <div class="container py-4 py-lg-5">
          <div class="row justify-content-center">
            <div class="col-12 col-lg-7 col-xl-6 col-xxl-5">
              <div class="forgot-top text-center mb-0 mb-md-2" data-aos="fade-up">
                <a class="forgot-brand justify-content-center mb-4 text-decoration-none" href="./login.html">
                  <span class="forgot-brand-mark"><i class="fa-solid fa-tree"></i></span>
                  <span class="forgot-brand-text">Family Legacy</span>
                </a>
              </div>

              <div class="forgot-card text-center" data-aos="fade-up" data-aos-delay="80">
                <div class="forgot-icon-wrap mx-auto mb-4">
                  <i class="fa-regular fa-envelope"></i>
                </div>

                <h1 class="forgot-title mb-2">Forgot Password?</h1>
                <p class="forgot-subtitle mb-2 mb-sm-3 mb-md-4 mx-auto">
                  No worries! Enter your email and we'll send you a link to reset your password.
                </p>

                <form action="./login.html" method="get" class="text-start">
                  <div class="mb-4">
                    <label for="forgotEmail" class="form-label forgot-form-label">Email Address</label>
                    <input type="email" id="forgotEmail" name="email" class="form-control forgot-input" placeholder="your@email.com" autocomplete="email">
                  </div>

                  <button type="submit" class="btn btn-forgot-primary w-100 d-inline-flex align-items-center justify-content-center gap-2">
                    Send Reset Link
                    <i class="fa-solid fa-arrow-right"></i>
                  </button>
                </form>
              </div>

              <a href="./login.html" class="forgot-back-link d-inline-flex align-items-center justify-content-center gap-2 mt-4">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Sign In
              </a>
            </div>
          </div>
        </div>
      </main>
  </div>
  
  <!-- ═══════════════════════════════════════════
     SCRIPTS
  ═══════════════════════════════════════════ -->
  <!-- jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <!-- Before/After Slider -->
  <script src="./assets/plugin/jquery.event.move.js"></script>
  <script src="./assets/plugin/jquery.twentytwenty.js"></script>
  <!-- Bootstrap 5 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- AOS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <!-- Custom JS -->
  <script src="./assets/app.js"></script>
</body>
</html>
